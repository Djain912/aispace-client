name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix (for example, 0.1.0)
        required: true
        type: string
      resume:
        description: Resume this version after a failed partial release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      tag_exists: ${{ steps.release.outputs.tag_exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate version and source
        id: release
        env:
          VERSION_INPUT: ${{ inputs.version }}
          RESUME: ${{ inputs.resume }}
        run: |
          VERSION="${VERSION_INPUT#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must look like 0.1.0" >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "releases must be started from the main branch" >&2
            exit 1
          fi
          TAG="v$VERSION"
          TAG_EXISTS=false
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            if [ "$RESUME" != "true" ]; then
              echo "tag $TAG already exists; select resume only to recover that exact release" >&2
              exit 1
            fi
            TAG_SHA="$(git rev-list -n 1 "$TAG")"
            HEAD_SHA="$(git rev-parse HEAD)"
            if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
              echo "tag $TAG points to $TAG_SHA, not current main $HEAD_SHA" >&2
              exit 1
            fi
            TAG_EXISTS=true
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "sha=$(git rev-parse HEAD)"
            echo "tag_exists=$TAG_EXISTS"
          } >> "$GITHUB_OUTPUT"

  credentials:
    name: Verify release credentials
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify npm authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not set" >&2
            exit 1
          fi
          npm whoami
      - name: Verify Homebrew tap access
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_GITHUB_TOKEN is not set" >&2
            exit 1
          fi
          git ls-remote "https://x-access-token:${TAP_TOKEN}@github.com/aispace-sh/homebrew-tap.git" HEAD >/dev/null

  preflight:
    name: Test release candidate
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run Go checks
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          go build -trimpath -o aispace .
          sh -n install.sh examples/*.sh
      - name: Test npm package
        working-directory: npm
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version
          npm test
          npm publish --dry-run --access public
      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --skip=publish

  publish:
    name: Publish release
    needs: [validate, credentials, preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: go.sum
      - name: Create release tag
        if: needs.validate.outputs.tag_exists != 'true'
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"
      - name: Inspect previous release attempt
        id: release_state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          PUBLISH=true
          DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          if [ "$DRAFT" = "true" ]; then
            echo "removing incomplete draft release $TAG before retry"
            gh release delete "$TAG" --yes
          elif [ "$DRAFT" = "false" ]; then
            echo "published release $TAG already exists; preserving its immutable assets"
            PUBLISH=false
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        if: steps.release_state.outputs.publish == 'true'
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      - name: Attach installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: gh release upload "$TAG" install.sh --clobber
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for NAME in checksums.txt install.sh \
            aispace_darwin_amd64 aispace_darwin_arm64 \
            aispace_linux_amd64 aispace_linux_arm64 \
            aispace_windows_amd64.exe aispace_windows_arm64.exe
          do
            grep -Fx "$NAME" <<<"$ASSETS" >/dev/null || { echo "release asset missing: $NAME" >&2; exit 1; }
          done
      - name: Verify Homebrew cask version
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          gh api repos/aispace-sh/homebrew-tap/contents/Casks/aispace.rb --jq .content \
            | base64 --decode | grep -F "version \"$VERSION\"" >/dev/null

  npm:
    name: Publish npm package
    needs: [validate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Set package version
        working-directory: npm
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version
      - name: Check for an existing npm publication
        id: npm_state
        working-directory: npm
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if npm view "@aispace-sh/cli@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@aispace-sh/cli@$VERSION is already published; preserving it"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish package
        if: steps.npm_state.outputs.published != 'true'
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  verify:
    name: Verify published package (${{ matrix.os }})
    needs: [validate, npm]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install and verify release
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5; do
            npm install --global "@aispace-sh/cli@$VERSION" && break
            if [ "$attempt" = 5 ]; then
              exit 1
            fi
            sleep 10
          done
          ACTUAL_VERSION="$(aispace version --json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          test "$ACTUAL_VERSION" = "$VERSION"
