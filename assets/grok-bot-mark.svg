<svg class="grok-bot-mark" viewBox="-15 -15 259 259" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Grok Bot mark">
  <style>
    .motion {
      transform-box: view-box;
      transform-origin: 114.27px 114.27px;
      animation: bob 2.8s ease-in-out infinite;
    }

    .eye { animation: blink 3.4s ease-in-out infinite; }

    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-3px) rotate(-1.5deg); }
      75% { transform: translateY(2px) rotate(1.5deg); }
    }

    @keyframes blink {
      0%, 44%, 48%, 100% { opacity: 1; }
      46% { opacity: 0.08; }
    }

    @media (prefers-reduced-motion: reduce) {
      .motion, .eye { animation: none; }
    }
  </style>
